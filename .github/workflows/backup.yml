name: backup

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run backup across all leagues
        env:
          SUPABASE_URL_TRUPE:           ${{ secrets.SUPABASE_URL_TRUPE }}
          SUPABASE_SERVICE_KEY_TRUPE:   ${{ secrets.SUPABASE_SERVICE_KEY_TRUPE }}
          SUPABASE_URL_FAMILIA:         ${{ secrets.SUPABASE_URL_FAMILIA }}
          SUPABASE_SERVICE_KEY_FAMILIA: ${{ secrets.SUPABASE_SERVICE_KEY_FAMILIA }}
        run: node scripts/backup.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bolao-backups-${{ github.run_id }}
          path: backup-*.json
          retention-days: 90
