name: fetch-results

on:
  schedule:
    # Two interleaved schedules to maximise our chances of winning a runner
    # slot on busy days. GH Actions throttles aggressively (free tier sees
    # 30 min – 5 h gaps even with */5), so we ask twice as often.
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run fetch-results across all leagues
        env:
          # Shared external APIs.
          FOOTBALL_API_KEY:               ${{ secrets.FOOTBALL_API_KEY }}
          ODDS_API_KEY:                   ${{ secrets.ODDS_API_KEY }}

          # Per-league Supabase env. New leagues need their pair of secrets
          # added below — names must match `scripts/leagues.config.json`.
          SUPABASE_URL_TRUPE:             ${{ secrets.SUPABASE_URL_TRUPE }}
          SUPABASE_SERVICE_KEY_TRUPE:     ${{ secrets.SUPABASE_SERVICE_KEY_TRUPE }}
          SUPABASE_URL_FAMILIA:           ${{ secrets.SUPABASE_URL_FAMILIA }}
          SUPABASE_SERVICE_KEY_FAMILIA:   ${{ secrets.SUPABASE_SERVICE_KEY_FAMILIA }}
          SUPABASE_URL_SCIB:              ${{ secrets.SUPABASE_URL_SCIB }}
          SUPABASE_SERVICE_KEY_SCIB:      ${{ secrets.SUPABASE_SERVICE_KEY_SCIB }}
        run: npm run fetch-results
