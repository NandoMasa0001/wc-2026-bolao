  <!-- Base -->
  <rect x="18" y="50" width="28" height="5" rx="1.5" fill="#FDD301"/>
  <rect x="18" y="50" width="28" height="1.5" fill="#E4BD00"/>

  <!-- Tiny heart at top to differentiate (family vibe) -->
  <path d="M32 10 C30.5 8, 28 8.5, 28 11 C28 12.5, 32 14, 32 14 C32 14, 36 12.5, 36 11 C36 8.5, 33.5 8, 32 10 Z" fill="#D8131A"/>
