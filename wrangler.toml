# Cloudflare Workers Static Assets config.
#
# Each Cloudflare Pages project that builds from this repo selects its own
# `name` via wrangler's --env flag. Default (no --env) deploys as the
# original "bolaotrupe" league; --env familia deploys the family league.

name = "bolao-scib"
compatibility_date = "2026-05-25"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# ---------- env: familia (BolaoFamilia league) ----------
[env.familia]
name = "bolaofamilia"

[env.familia.assets]
directory = "./dist"
not_found_handling = "single-page-application"

# ---------- env: scib (Bolao-SCIB league) ----------
[env.scib]
name = "bolao-scib"

[env.scib.assets]
directory = "./dist"
not_found_handling = "single-page-application"
